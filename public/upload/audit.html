<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>atLIB 監査ログ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #eef1f6;
    --surface: #ffffff;
    --ink: #1a2333;
    --muted: #647089;
    --faint: #97a1b3;
    --accent: #2c64a6;
    --accent-ink: #16233c;
    --line: #e2e6ec;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 32px 16px 24px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .page { max-width: 960px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; }
  .site-header { margin-bottom: 20px; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand .mark-icon { width: 32px; height: 32px; border-radius: 8px; flex: none; }
  .brand .wordmark { display: flex; flex-direction: column; line-height: 1.15; }
  .brand .wordmark .name { font-size: 1rem; font-weight: 800; color: var(--accent-ink); letter-spacing: -0.01em; }
  .brand .wordmark .tagline { font-size: 0.6rem; font-weight: 700; color: var(--accent); letter-spacing: 0.14em; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px 28px 32px;
    box-shadow: 0 1px 2px rgba(20, 30, 50, 0.04), 0 8px 24px -16px rgba(20, 30, 50, 0.15);
    flex: 1;
  }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  .lede { color: var(--muted); font-size: 0.88rem; margin: 0 0 8px; }
  .back { font-size: 0.85rem; margin-bottom: 12px; }
  .back a { color: var(--muted); }
  #status { margin-top: 12px; color: var(--muted); font-size: 0.85rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 0.82rem; }
  th, td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  td.nowrap { white-space: nowrap; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
  .pill.ok { background: #e4f5ec; color: #1e8a57; }
  .pill.warn { background: #fbf0dc; color: #a6710b; }
  .pill.danger { background: #fbe7e4; color: #c23b31; }
  .pill.muted { background: #eef1f5; color: var(--muted); }
  .empty { color: var(--muted); margin-top: 16px; }
  .site-footer {
    margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line);
    text-align: center; font-size: 0.75rem; color: var(--faint);
  }
</style>
</head>
<body>
<div class="page">
  <header class="site-header">
    <div class="brand">
      <img class="mark-icon" src="/assets/logo-mark.png" alt="">
      <div class="wordmark"><span class="name">atLIB</span><span class="tagline">SECURE SEND</span></div>
    </div>
  </header>

  <main class="card">
    <p class="back"><a href="/">← ファイル送信に戻る</a></p>
    <h1>監査ログ</h1>
    <p class="lede">直近200件の操作履歴です(全ユーザー分)。</p>
    <div id="status"></div>
    <table id="log-table" style="display:none">
      <thead><tr><th>日時</th><th>イベント</th><th>実行者</th><th>ファイル</th><th>送信者</th><th>宛先</th><th>IP</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="empty-msg" style="display:none">記録はまだありません。</div>
  </main>

  <footer class="site-footer">© 2026 atLIB Inc.</footer>
</div>

<script src="audit.js"></script>
</body>
</html>
