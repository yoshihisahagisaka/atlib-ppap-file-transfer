<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>atLIB SecureSend</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #eef1f6;
    --surface: #ffffff;
    --ink: #1a2333;
    --muted: #647089;
    --faint: #97a1b3;
    --accent: #2c64a6;
    --accent-ink: #16233c;
    --line: #e2e6ec;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 40px 16px 24px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .page { max-width: 480px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; }
  .site-header { margin-bottom: 20px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px 28px 32px;
    box-shadow: 0 1px 2px rgba(20, 30, 50, 0.04), 0 8px 24px -16px rgba(20, 30, 50, 0.15);
    flex: 1;
  }
  .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 4px; }
  .brand .mark-icon { width: 34px; height: 34px; border-radius: 9px; flex: none; }
  .brand .wordmark { display: flex; flex-direction: column; line-height: 1.2; }
  .brand .wordmark .name { font-size: 1.05rem; font-weight: 800; color: var(--accent-ink); letter-spacing: -0.01em; }
  .brand .wordmark .tagline { font-size: 0.62rem; font-weight: 700; color: var(--accent); letter-spacing: 0.14em; }
  h1 { font-size: 1.15rem; margin: 18px 0 12px; }
  #info { background: #f5f7fa; border: 1px solid var(--line); padding: 12px 14px; border-radius: 10px; font-size: 0.9rem; line-height: 1.7; }
  .file-list { list-style: none; margin: 10px 0 0; padding: 0; border-top: 1px solid var(--line); }
  .file-list li {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.85rem;
  }
  .file-list .fname { overflow-wrap: anywhere; }
  .file-list .fsize { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }
  .file-list a.dl-btn {
    flex: none; text-decoration: none; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 6px; padding: 4px 10px; font-size: 0.78rem; font-weight: 600;
  }
  .file-list a.dl-btn:hover { background: var(--accent); color: #fff; }
  #files-section { display: none; margin-top: 16px; }
  #download-all { background: var(--accent-ink); }
  input {
    width: 100%; box-sizing: border-box; padding: 10px; margin-top: 8px; font-size: 1.2rem;
    letter-spacing: 0.2em; text-align: center; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px;
  }
  input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    margin-top: 12px; padding: 10px 20px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%;
    color: #fff; background: var(--accent); border: none; border-radius: 8px;
  }
  button:hover { background: var(--accent-ink); }
  #status { margin-top: 16px; white-space: pre-wrap; font-size: 0.9rem; color: var(--muted); }
  #otp-section { display: none; margin-top: 16px; }
  .site-footer {
    margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line);
    text-align: center; font-size: 0.75rem; color: var(--faint);
  }
</style>
</head>
<body>
<div class="page">
  <main class="card">
    <div class="brand">
      <img class="mark-icon" src="/assets/logo-mark.png" alt="">
      <div class="wordmark"><span class="name">atLIB</span><span class="tagline">SECURE SEND</span></div>
    </div>
    <h1>ファイルダウンロード</h1>
    <div id="info">読み込み中...</div>
    <ul id="file-list" class="file-list"></ul>

    <div id="request-section" style="display:none">
      <button id="request-otp">確認コードをメールで受け取る</button>
    </div>

    <div id="otp-section">
      <p>登録済みのメールアドレスに確認コードを送信しました。10分以内に入力してください。</p>
      <input id="otp-code" inputmode="numeric" maxlength="6" placeholder="123456">
      <button id="verify-otp">認証する</button>
    </div>

    <div id="files-section">
      <p>認証が完了しました。ファイルをダウンロードしてください。</p>
      <ul id="download-list" class="file-list"></ul>
      <button id="download-all">すべてダウンロード</button>
    </div>

    <div id="status"></div>
  </main>

  <footer class="site-footer">© 2026 atLIB Inc.</footer>
</div>

<script src="/download.js"></script>
</body>
</html>
